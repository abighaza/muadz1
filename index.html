<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Punya Mu'adz</title>
    <style>
      :root {
        --primary-color: #4caf50;
        --accent-color: #ff9800;
        --bg-color: #1a237e;
        --font-family: "Comic Sans MS", "Chalkboard SE", sans-serif;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: var(--font-family);
      }

      body {
        background: radial-gradient(circle, #283593 0%, #0d47a1 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 15px;
        min-height: 100vh;
        color: white;
        overflow-x: hidden;
      }

      /* Header Container dengan Avatar Bulat di Kiri Atas */
      .header-container {
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        width: 100%;
        max-width: 1200px;
        margin-bottom: 15px;
      }

      .user-avatar {
        position: absolute;
        left: 10px;
        top: 50%;
        transform: translateY(-50%);
        width: 60px;
        height: 60px;
        border-radius: 50%;
        border: 3px solid #ffd54f;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
        object-fit: cover;
        background: #ffffff;
      }

      h1 {
        color: #ffd54f;
        text-shadow: 2px 4px 10px rgba(0, 0, 0, 0.5);
        text-align: center;
        font-size: 1.8rem;
      }

      .game-wrapper {
        display: flex;
        flex-wrap: wrap;
        gap: 30px;
        justify-content: center;
        align-items: flex-start;
        max-width: 1200px;
        width: 100%;
      }

      /* 3D Board Perspective Container */
      .board-viewport {
        perspective: 1000px;
        padding: 20px;
      }

      .board-container {
        position: relative;
        width: 520px;
        height: 520px;
        background: #ffffff;
        border: 10px solid #2e7d32;
        border-radius: 20px;
        box-shadow:
          0 30px 50px rgba(0, 0, 0, 0.6),
          inset 0 0 15px rgba(0, 0, 0, 0.2);
        transform: rotateX(28deg) rotateZ(-2deg);
        transform-style: preserve-3d;
        transition: transform 0.5s ease;
      }

      .board-container:hover {
        transform: rotateX(18deg) rotateZ(0deg);
      }

      /* Canvas Overlay untuk Gambar Ular & Tangga 3D */
      #board-canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 5;
        pointer-events: none;
      }

      .board-grid {
        display: grid;
        grid-template-columns: repeat(10, 1fr);
        grid-template-rows: repeat(10, 1fr);
        width: 100%;
        height: 100%;
        position: relative;
        z-index: 2;
      }

      .cell {
        border: 1px solid rgba(0, 0, 0, 0.1);
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: flex-start;
        padding: 2px 4px;
        font-size: 0.75rem;
        font-weight: bold;
        color: #333;
        position: relative;
        cursor: pointer;
        transition: background-color 0.2s;
      }

      .cell-100 {
        background-color: #ffe082 !important;
      }

      /* Target Cell Highlight Animation */
      .cell.target-highlight {
        animation: glow 1s infinite alternate;
        cursor: pointer !important;
        z-index: 10;
      }

      @keyframes glow {
        from {
          background-color: #fff59d;
          box-shadow: inset 0 0 10px #fbc02d;
        }
        to {
          background-color: #ffee58;
          box-shadow: inset 0 0 20px #f57f17;
        }
      }

      /* 3D Player Token */
      .player-token {
        width: 32px;
        height: 32px;
        background: radial-gradient(circle at 30% 30%, #ff4081, #c2185b);
        border: 2px solid #ffffff;
        border-radius: 50%;
        position: absolute;
        z-index: 100;
        box-shadow:
          0 10px 15px rgba(0, 0, 0, 0.5),
          inset -2px -2px 6px rgba(0, 0, 0, 0.4);
        transition:
          left 0.4s ease,
          top 0.4s ease,
          transform 0.4s ease;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 1.1rem;
        transform: translateZ(20px);
      }

      /* Control Panel / Quiz Panel */
      .panel {
        flex: 1;
        min-width: 300px;
        max-width: 450px;
        background: rgba(255, 255, 255, 0.95);
        padding: 20px;
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        display: flex;
        flex-direction: column;
        gap: 15px;
        color: #333;
      }

      .status-box {
        background: #e8f5e9;
        padding: 12px 18px;
        border-radius: 12px;
        font-weight: bold;
        color: #1b5e20;
        display: flex;
        justify-content: space-between;
        border: 2px solid #a5d6a7;
      }

      .wrong-counter-badge {
        background: #ffebee;
        color: #c62828;
        padding: 4px 8px;
        border-radius: 8px;
        font-size: 0.85rem;
        border: 1px solid #ef9a9a;
      }

      .instruction-banner {
        background: #e1f5fe;
        border: 2px solid #81d4fa;
        color: #0277bd;
        padding: 10px;
        border-radius: 10px;
        font-weight: bold;
        text-align: center;
        font-size: 0.95rem;
      }

      .quiz-box {
        background: #fff8e1;
        border: 2px solid #ffe082;
        padding: 15px;
        border-radius: 15px;
      }

      .subject-badge {
        display: inline-block;
        background: #ff9800;
        color: white;
        padding: 4px 12px;
        border-radius: 12px;
        font-size: 0.85rem;
        font-weight: bold;
        margin-bottom: 8px;
      }

      .question-text {
        font-size: 1.05rem;
        color: #333;
        margin-bottom: 12px;
        font-weight: 600;
        line-height: 1.4;
      }

      .options-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .option-btn {
        background: white;
        border: 2px solid #ffe082;
        padding: 10px;
        border-radius: 10px;
        cursor: pointer;
        font-weight: bold;
        color: #5d4037;
        transition: all 0.2s;
        text-align: center;
      }

      .option-btn:hover {
        background: #ffe082;
        transform: translateY(-2px);
      }

      /* 3D Spin Wheel Control */
      .spin-area {
        text-align: center;
        padding: 15px;
        background: #f5f5f5;
        border-radius: 15px;
        display: flex;
        flex-direction: column;
        align-items: center;
        border: 2px solid #e0e0e0;
      }

      .wheel-wrapper {
        position: relative;
        width: 150px;
        height: 150px;
        margin: 10px 0;
      }

      .wheel-pointer {
        position: absolute;
        top: -10px;
        left: 50%;
        transform: translateX(-50%);
        width: 0;
        height: 0;
        border-left: 10px solid transparent;
        border-right: 10px solid transparent;
        border-top: 20px solid #d32f2f;
        z-index: 20;
        filter: drop-shadow(0 3px 4px rgba(0, 0, 0, 0.4));
      }

      .wheel {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        border: 5px solid #333;
        position: relative;
        overflow: hidden;
        transition: transform 3s cubic-bezier(0.15, 0.9, 0.15, 1);
        background: conic-gradient(
          #ef5350 0deg 60deg,
          #ab47bc 60deg 120deg,
          #42a5f5 120deg 180deg,
          #26a69a 180deg 240deg,
          #ffca28 240deg 300deg,
          #ffa726 300deg 360deg
        );
        box-shadow: 0 8px 15px rgba(0, 0, 0, 0.3);
      }

      .wheel-num {
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        text-align: center;
        font-weight: bold;
        font-size: 1.2rem;
        color: white;
        text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
      }

      .num-1 {
        transform: rotate(30deg);
        padding-top: 8px;
      }
      .num-2 {
        transform: rotate(90deg);
        padding-top: 8px;
      }
      .num-3 {
        transform: rotate(150deg);
        padding-top: 8px;
      }
      .num-4 {
        transform: rotate(210deg);
        padding-top: 8px;
      }
      .num-5 {
        transform: rotate(270deg);
        padding-top: 8px;
      }
      .num-6 {
        transform: rotate(330deg);
        padding-top: 8px;
      }

      .spin-result {
        font-size: 1.1rem;
        font-weight: bold;
        color: #2e7d32;
        margin-top: 5px;
        height: 25px;
      }

      .btn {
        background-color: var(--primary-color);
        color: white;
        border: none;
        padding: 12px 24px;
        font-size: 1rem;
        font-weight: bold;
        border-radius: 25px;
        cursor: pointer;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        transition: all 0.2s;
        width: 100%;
      }

      .btn:disabled {
        background-color: #b0bec5;
        cursor: not-allowed;
        box-shadow: none;
      }

      .btn-restart {
        background-color: #ef5350;
      }

      @media (max-width: 600px) {
        .board-container {
          width: 330px;
          height: 330px;
          transform: rotateX(15deg);
        }
        .cell {
          font-size: 0.55rem;
        }
        .player-token {
          width: 22px;
          height: 22px;
          font-size: 0.75rem;
        }
        .user-avatar {
          width: 45px;
          height: 45px;
        }
        h1 {
          font-size: 1.3rem;
          margin-left: 50px;
        }
      }
    </style>
  </head>
  <body>
    <!-- Header dengan Avatar Bulat di Kiri Atas -->
    <div class="header-container">
      <img
        src="./image/aa.jpg"
        alt="Foto Profil Pemain"
        class="user-avatar"
        id="user-avatar"
        title="Profil Pemain"
      />
      <h1>🎲 Game Mu'adz</h1>
    </div>

    <div class="game-wrapper">
      <!-- Papan 3D Viewport -->
      <div class="board-viewport">
        <div class="board-container" id="board-container">
          <canvas id="board-canvas" width="500" height="500"></canvas>
          <div class="board-grid" id="board-grid"></div>
          <div class="player-token" id="player-token">🏃</div>
        </div>
      </div>

      <!-- Panel Kontrol & Soal -->
      <div class="panel">
        <div class="status-box">
          <div>Posisi Pemain: Kotak <span id="pos-display">1</span> / 100</div>
          <div class="wrong-counter-badge">
            Salah: <span id="wrong-count-display">0</span>/2
          </div>
        </div>

        <div class="instruction-banner" id="instruction-banner">
          1. Jawab soal cerita terlebih dahulu!
        </div>

        <!-- Box Tantangan Soal -->
        <div class="quiz-box" id="quiz-box">
          <span class="subject-badge" id="subject-badge">MATEMATIKA</span>
          <div class="question-text" id="question-text">
            Jawab pertanyaan untuk memutar roda spin...
          </div>
          <div class="options-grid" id="options-container"></div>
        </div>

        <!-- Box Roda Spin -->
        <div class="spin-area">
          <div class="wheel-wrapper">
            <div class="wheel-pointer"></div>
            <div class="wheel" id="wheel">
              <div class="wheel-num num-1">1</div>
              <div class="wheel-num num-2">2</div>
              <div class="wheel-num num-3">3</div>
              <div class="wheel-num num-4">4</div>
              <div class="wheel-num num-5">5</div>
              <div class="wheel-num num-6">6</div>
            </div>
          </div>
          <div class="spin-result" id="spin-result"></div>
          <button class="btn" id="btn-spin" disabled>🎡 Putar Roda Spin</button>
        </div>

        <button class="btn btn-restart" id="btn-restart">
          🔄 Ulangi dari Awal
        </button>
      </div>

    <script>
      // === AUDIO SFX (Web Audio API) ===
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      let audioCtx;

      function initAudio() {
        if (!audioCtx) audioCtx = new AudioContext();
        if (audioCtx.state === "suspended") audioCtx.resume();
      }

      function playSound(type) {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === "correct") {
          osc.type = "triangle";
          osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
          osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
          gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(
            0.001,
            audioCtx.currentTime + 0.3,
          );
          osc.start();
          osc.stop(audioCtx.currentTime + 0.3);
        } else if (type === "wrong") {
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(180, audioCtx.currentTime);
          osc.frequency.linearRampToValueAtTime(
            110,
            audioCtx.currentTime + 0.3,
          );
          gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(
            0.001,
            audioCtx.currentTime + 0.3,
          );
          osc.start();
          osc.stop(audioCtx.currentTime + 0.3);
        } else if (type === "reset") {
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(800, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(
            100,
            audioCtx.currentTime + 0.6,
          );
          gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(
            0.001,
            audioCtx.currentTime + 0.6,
          );
          osc.start();
          osc.stop(audioCtx.currentTime + 0.6);
        } else if (type === "step") {
          osc.type = "sine";
          osc.frequency.setValueAtTime(400, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(
            0.001,
            audioCtx.currentTime + 0.1,
          );
          osc.start();
          osc.stop(audioCtx.currentTime + 0.1);
        } else if (type === "ladder") {
          osc.type = "sine";
          osc.frequency.setValueAtTime(300, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(
            800,
            audioCtx.currentTime + 0.4,
          );
          gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(
            0.001,
            audioCtx.currentTime + 0.4,
          );
          osc.start();
          osc.stop(audioCtx.currentTime + 0.4);
        } else if (type === "snake") {
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(600, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(
            200,
            audioCtx.currentTime + 0.4,
          );
          gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(
            0.001,
            audioCtx.currentTime + 0.4,
          );
          osc.start();
          osc.stop(audioCtx.currentTime + 0.4);
        }
      }

      const ladders = [

        let col = (cellNum - 1) % 10;
        if (row % 2 === 1) {
          col = 9 - col;
        }
        let y = (9 - row) * 50 + 25;
        let x = col * 50 + 25;
        return { x, y };

          const end = getCellCenter(ladder.to);

          const dx = end.x - start.x;
          const dy = end.y - start.y;
          const distance = Math.hypot(dx, dy);
          const angle = Math.atan2(dy, dx);

          ctx.translate(start.x, start.y);
          ctx.rotate(angle);

          // Bayangan Tangga
          ctx.fillStyle = "rgba(0,0,0,0.25)";

          woodGrad.addColorStop(1, "#3e2723");

          ctx.fillStyle = woodGrad;
          ctx.fillRect(0, -15, distance, 6);
          ctx.fillRect(0, 9, distance, 6);

          // Anak Tangga
          const stepCount = Math.floor(distance / 22);
          for (let i = 1; i <= stepCount; i++) {

            ctx.fillStyle = "#8d6e63";
            ctx.fillRect(stepX - 3, -15, 6, 30);
            ctx.fillStyle = "#3e2723";

          }

          let midY = (head.y + tail.y) / 2 + 5;
          ctx.quadraticCurveTo(midX, midY, tail.x + 5, tail.y + 8);
          ctx.lineWidth = 14;
          ctx.strokeStyle = "rgba(0,0,0,0.25)";
          ctx.lineCap = "round";
          ctx.stroke();

          // Badan Ular
          ctx.beginPath();
          ctx.moveTo(head.x, head.y);
          ctx.quadraticCurveTo(
            (head.x + tail.x) / 2 + 30,
            (head.y + tail.y) / 2,
            tail.x,
            tail.y,
          );
          ctx.lineWidth = 14;
          ctx.strokeStyle = snake.color;
          ctx.lineCap = "round";
          ctx.stroke();

          // Highlight Ular
          ctx.beginPath();
          ctx.moveTo(head.x - 2, head.y - 2);
          ctx.quadraticCurveTo(
            (head.x + tail.x) / 2 + 28,
            (head.y + tail.y) / 2 - 2,
            tail.x - 2,
            tail.y - 2,
          );
          ctx.lineWidth = 4;
          ctx.strokeStyle = "rgba(255,255,255,0.4)";
          ctx.lineCap = "round";
          ctx.stroke();

          // Kepala Ular
          ctx.beginPath();
          ctx.arc(head.x, head.y, 11, 0, Math.PI * 2);
          ctx.fillStyle = snake.color;
          ctx.fill();
          ctx.lineWidth = 2;
          ctx.strokeStyle = "#ffffff";
          ctx.stroke();

          // Mata Ular
          ctx.beginPath();
          ctx.arc(head.x - 3, head.y - 3, 3, 0, Math.PI * 2);
          ctx.arc(head.x + 3, head.y - 3, 3, 0, Math.PI * 2);
          ctx.fillStyle = "#ffffff";
          ctx.fill();

          ctx.beginPath();
          ctx.arc(head.x - 3, head.y - 3, 1.5, 0, Math.PI * 2);
          ctx.arc(head.x + 3, head.y - 3, 1.5, 0, Math.PI * 2);
          ctx.fillStyle = "#000000";
          ctx.fill();

          ctx.restore();
        });
      }

      // Ambil Soal Cerita Sesuai Posisi Kotak Pemain
      function renderQuiz() {
        const qIndex = (playerPosition - 1) % storyQuestions.length;
        const q = storyQuestions[qIndex];
        currentCorrectAnswer = q.a;

        document.getElementById("subject-badge").innerText = q.subject;
        document.getElementById("question-text").innerText =
          `[Soal ${q.id}] ${q.q}`;
        document.getElementById("spin-result").innerText = "";
        document.getElementById("instruction-banner").innerText =
          "1. Jawab soal cerita terlebih dahulu!";
        document.getElementById("wrong-count-display").innerText =
          wrongAttempts;

        const optsContainer = document.getElementById("options-container");
        optsContainer.innerHTML = "";

        q.opts.forEach((opt) => {
          const btn = document.createElement("button");
          btn.className = "option-btn";
          btn.innerText = opt;
          btn.onclick = () => checkAnswer(opt);
          optsContainer.appendChild(btn);
        });
      }

      // PENANGANAN SALAH JAWAB (Reset ke Kotak 1 jika salah > 2 kali)
      function checkAnswer(selectedOpt) {
        if (selectedOpt === currentCorrectAnswer) {
          playSound("correct");
          wrongAttempts = 0; // Reset hitungan kesalahan jika berhasil menjawab benar
          document.getElementById("wrong-count-display").innerText =
            wrongAttempts;
          document.getElementById("instruction-banner").innerText =
            "2. Jawaban Benar! Klik 'Putar Roda Spin'.";
          document.getElementById("btn-spin").disabled = false;
          disableQuizButtons();
        } else {
          wrongAttempts++;
          document.getElementById("wrong-count-display").innerText =
            wrongAttempts;

          if (wrongAttempts > 2) {
            playSound("reset");
            alert(
              "⚠️ Kamu telah salah menjawab lebih dari 2 kali! Karakter kamu kembali ke kotak 1.",
            );
            wrongAttempts = 0;
            playerPosition = 1;
            waitingForUserClick = false;
            clearHighlights();
            updateTokenPosition();
            document.getElementById("btn-spin").disabled = true;
            renderQuiz();
          } else {
            playSound("wrong");
            alert(
              `Jawaban kurang tepat! (Kesalahan ${wrongAttempts}/2). Coba jawab soal baru berikut ini 💪`,
            );
            renderQuiz();
          }
        }
      }

      function disableQuizButtons() {
        const btns = document.querySelectorAll(".option-btn");
        btns.forEach((b) => (b.disabled = true));
      }

      // Render Papan 10x10 Warni Warni
      function createBoard() {
        const boardGrid = document.getElementById("board-grid");
        boardGrid.innerHTML = "";

        for (let row = 9; row >= 0; row--) {
          for (let col = 0; col < 10; col++) {
            let cellNum;
            if (row % 2 === 1) {
              cellNum = row * 10 + (10 - col);
            } else {
              cellNum = row * 10 + (col + 1);
            }

            const cell = document.createElement("div");
            cell.className = `cell ${cellNum === 100 ? "cell-100" : ""}`;
            cell.id = `cell-${cellNum}`;
            cell.innerText = cellNum;

            const colorIndex = (cellNum - 1) % cellColors.length;
            cell.style.backgroundColor = cellColors[colorIndex];

            cell.onclick = () => handleCellClick(cellNum);

            boardGrid.appendChild(cell);
          }
        }
        drawCanvasGraphics();
        updateTokenPosition();
      }

      function updateTokenPosition() {
        const targetCell = document.getElementById(`cell-${playerPosition}`);
        const token = document.getElementById("player-token");

        token.style.left = `${targetCell.offsetLeft + 9}px`;
        token.style.top = `${targetCell.offsetTop + 9}px`;
        document.getElementById("pos-display").innerText = playerPosition;
      }

      // Putar Roda Spin
      document.getElementById("btn-spin").onclick = () => {
        initAudio();
        const btnSpin = document.getElementById("btn-spin");
        btnSpin.disabled = true;

        pendingSpinResult = Math.floor(Math.random() * 6) + 1;

        const segmentAngle = 60;
        const targetAngle = (6 - pendingSpinResult) * segmentAngle + 30;
        currentRotation += 1800 + (targetAngle - (currentRotation % 360));

        const wheel = document.getElementById("wheel");
        wheel.style.transform = `rotate(${currentRotation}deg)`;

        setTimeout(() => {
          document.getElementById("spin-result").innerText =
            `Hasil Spin: +${pendingSpinResult} Langkah!`;

          const targetCellNum = playerPosition + pendingSpinResult;
          if (targetCellNum <= 100) {
            waitingForUserClick = true;
            highlightTargetCell(targetCellNum);
            document.getElementById("instruction-banner").innerText =
              `3. KLIK KOTAK ${targetCellNum} pada papan untuk berjalan! 🏃‍♂️`;
          } else {
            alert("Langkah melebihi kotak 100! Kamu diam di tempat.");
            renderQuiz();
          }
        }, 3000);
      };

      function highlightTargetCell(targetNum) {
        clearHighlights();
        const cell = document.getElementById(`cell-${targetNum}`);
        if (cell) cell.classList.add("target-highlight");
      }

      function clearHighlights() {
        document
          .querySelectorAll(".cell")
          .forEach((c) => c.classList.remove("target-highlight"));
      }

      // Handler Klik Kotak oleh User
      function handleCellClick(cellNum) {
        if (!waitingForUserClick) return;

        const expectedTarget = playerPosition + pendingSpinResult;
        if (cellNum !== expectedTarget) {
          alert(`Silakan klik kotak ${expectedTarget} sesuai hasil spin!`);
          return;
        }

        waitingForUserClick = false;
        clearHighlights();
        document.getElementById("instruction-banner").innerText =
          "Pemain sedang melangkah...";

        let stepsLeft = pendingSpinResult;
        const stepInterval = setInterval(() => {
          playerPosition++;
          updateTokenPosition();
          playSound("step");
          stepsLeft--;

          if (stepsLeft === 0) {
            clearInterval(stepInterval);

            setTimeout(() => {
              if (snakesAndLaddersMap[playerPosition]) {
                const target = snakesAndLaddersMap[playerPosition];
                if (target > playerPosition) {
                  playSound("ladder");
                  alert(`Hore! Kamu naik tangga ke kotak ${target} 🪜✨`);
                } else {
                  playSound("snake");
                  alert(`Awas! Kamu tergelincir ular ke kotak ${target} 🐍`);
                }
                playerPosition = target;
                updateTokenPosition();
              }

              if (playerPosition === 100) {
                alert(
                  "SELAMAT! 🏆 Kamu berhasil mencapai kotak 100 dan memenangkan permainan!",
                );
              } else {
                renderQuiz();
              }
            }, 400);
          }
        }, 300);
      }

      document.getElementById("btn-restart").onclick = () => {
        if (confirm("Ulangi permainan dari awal?")) {
          playerPosition = 1;
          wrongAttempts = 0;
          waitingForUserClick = false;
          clearHighlights();
          updateTokenPosition();
          document.getElementById("btn-spin").disabled = true;
          renderQuiz();
        }
      };

      window.onload = () => {
        createBoard();
        renderQuiz();
        window.onresize = () => {
          drawCanvasGraphics();
          updateTokenPosition();
        };
      };
    </script>
  </body>
</html>
